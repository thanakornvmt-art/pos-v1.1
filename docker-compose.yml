services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos_local_only
      POSTGRES_DB: morning_pos
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pos-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d morning_pos"]
      interval: 5s
      retries: 10
volumes:
  pos-data:
